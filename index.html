<!DOCTYPE html>
<html lang="en">
<head>
    < charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Flax eSports</title>
    <style>
        body {
            margin: 0;
            padding: 0;
            background-color: #0f0f0f;
            color: #ffffff;
            font-family: Arial, sans-serif;
            padding-bottom: 70px;
        }
        .page-content {
            padding: 20px;
            display: none; /* Sabhi pages pehle hidden rahenge */
        }
        .active-page {
            display: block; /* Jo active page hoga wahi dikhega */
        }
        .nav {
            position: fixed;
            bottom: 0;
            left: 0;
            width: 100%;
            background-color: #1a1a1a;
            display: flex;
            justify-content: space-around;
            padding: 12px 0;
            border-top: 1px solid #333;
            z-index: 1000;
        }
        .nav div {
            cursor: pointer;
            text-align: center;
            font-size: 14px;
            color: #fff;
        }
    </style>
</head>
<body>

    <!-- Home Tab Screen -->
    <div id="home" class="page-content active-page">
        <h2>🏠 Home Page</h2>
        <p>Welcome to Flax eSports Tournaments!</p>
    </div>

    <!-- Wallet Tab Screen -->
    <div id="wallet" class="page-content">
        <h2>💳 Wallet</h2>
        <p>Your Balance: ₹0.00</p>
    </div>

    <!-- Leaderboard Tab Screen -->
    <div id="leaderboard" class="page-content">
        <h2>📊 Leaderboard</h2>
        <p>Top Players of the Week!</p>
    </div>

    <!-- Logout Tab Screen -->
    <div id="logout" class="page-content">
        <h2>👤 Logout</h2>
        <p>You have been logged out.</p>
    </div>

    <!-- Bottom Navigation Bar -->
    <div class="nav">
        <div onclick="switchTab('home')">🏠<br>Home</div>
        <div onclick="switchTab('wallet')">💳<br>Wallet</div>
        <div onclick="switchTab('leaderboard')">📊<br>Leaderboard</div>
        <div onclick="switchTab('logout')">👤<br>Logout</div>
    </div>

    <script>
        function switchTab(tabId) {
            // Sabhi pages ko hide kar do
            let pages = document.querySelectorAll('.page-content');
            pages.forEach(page => page.classList.remove('active-page'));
            
            // Selected page ko show kar do
            document.getElementById(tabId).classList.add('active-page');
        }
    </script>
</body>
</html>
<!-- Wallet Extra Section -->
<div style="background: #1a1a1a; padding: 15px; border-radius: 10px; margin-top: 10px; border: 1px solid #333;">
    <h3 style="font-size: 16px; margin-top: 0; color: #fff;">Add Money</h3>
    <input type="text" placeholder="Enter UTR / Transaction ID" style="width: 100%; padding: 10px; margin-bottom: 10px; background: #0f0f0f; border: 1px solid #444; color: #fff; box-sizing: border-box;">
    <button onclick="alert('Submitted!')" style="width: 100%; padding: 10px; background: #28a745; color: #fff; border: none; font-weight: bold;">Submit</button>
</div>
