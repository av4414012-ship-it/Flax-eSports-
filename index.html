<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Flax eSports</title>
    <style>
        body {
            margin: 0;
            padding: 0;
            background-color: #0f0f0f;
            color: #ffffff;
            font-family: Arial, sans-serif;
            padding-bottom: 70px;
        }
        .page-content {
            padding: 20px;
            display: none;
        }
        .active-page {
            display: block;
        }
        .nav {
            position: fixed;
            bottom: 0;
            left: 0;
            width: 100%;
            background-color: #1a1a1a;
            display: flex;
            justify-content: space-around;
            padding: 12px 0;
            border-top: 1px solid #333;
            z-index: 1000;
        }
        .nav div {
            cursor: pointer;
            text-align: center;
            font-size: 14px;
            color: #fff;
        }
    </style>
</head>
<body>

    <!-- Home Tab Screen -->
    <div id="home" class="page-content active-page">
        <h2>🏠 Home Page</h2>
        <p>Welcome to Flax eSports Tournaments!</p>
    </div>

    <!-- Wallet Tab Screen with QR Code -->
    <div id="wallet" class="page-content">
        <h2>💳 Add Money to Wallet</h2>
        <p style="font-size: 14px; color: #ccc;">Scan QR code below using any UPI app to add funds.</p>
        
        <div style="text-align: center; background: #1a1a1a; padding: 15px; border-radius: 10px; margin: 15px 0; border: 1px solid #333;">
            <img src="https://ibb.co/zWRqXz8G" alt="UPI QR Code" style="width: 180px; height: 180px; border-radius: 8px;">
            <p style="margin-top: 10px; font-size: 14px; color: #aaa;">UPI ID: <strong>abhishek937@paytm</strong></p>
        </div>

        <div style="background: #1a1a1a; padding: 15px; border-radius: 10px; border: 1px solid #333;">
            <h3 style="font-size: 16px; margin-top: 0;">Submit Payment Proof</h3>
            <input type="text" placeholder="Enter 12-digit UTR / Transaction ID" style="width: 100%; padding: 10px; margin-bottom: 10px; background: #0f0f0f; border: 1px solid #444; color: #fff; box-sizing: border-box; border-radius: 5px;">
            <button onclick="alert('Payment submitted successfully!')" style="width: 100%; padding: 10px; background: #28a745; color: #fff; border: none; font-weight: bold; border-radius: 5px; cursor: pointer;">Submit Payment</button>
        </div>
    </div>

    <!-- Leaderboard Tab Screen -->
    <div id="leaderboard" class="page-content">
        <h2>📊 Leaderboard</h2>
        <p>Top Players of the Week!</p>
    </div>

    <!-- Logout Tab Screen -->
    <div id="logout" class="page-content">
        <h2>👤 Logout</h2>
        <p>You have been logged out.</p>
    </div>

    <!-- Bottom Navigation Bar -->
    <div class="nav">
        <div onclick="switchTab('home')">🏠<br>Home</div>
        <div onclick="switchTab('wallet')">💳<br>Wallet</div>
        <div onclick="switchTab('leaderboard')">📊<br>Leaderboard</div>
        <div onclick="switchTab('logout')">👤<br>Logout</div>
    </div>

    <script>
        function switchTab(tabId) {
            let pages = document.querySelectorAll('.page-content');
            pages.forEach(page => page.classList.remove('active-page'));
            document.getElementById(tabId).classList.add('active-page');
        }
    </script>
</body>
</html>
