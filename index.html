<!DOCTYPE html>
<html lang="hi">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Flax eSports</title>
  <style>
    * { margin: 0; padding: 0; box-sizing: border-box; font-family: sans-serif; }
    body { background-color: #0b0b0d; color: #fff; min-height: 100vh; }
    .auth { display: flex; flex-direction: column; justify-content: center; align-items: center; height: 100vh; padding: 20px; }
    .box { background: #16161e; width: 100%; max-width: 350px; padding: 20px; border-radius: 10px; border: 1px solid #333; text-align: center; }
    .box h2 { color: #f39c12; margin-bottom: 15px; }
    input { width: 100%; padding: 10px; margin-bottom: 10px; background: #0b0b0d; border: 1px solid #444; color: #fff; border-radius: 5px; }
    button { width: 100%; padding: 10px; background: #f39c12; border: none; font-weight: bold; border-radius: 5px; cursor: pointer; color: #000; }
    .toggle { color: #f39c12; font-size: 12px; margin-top: 10px; cursor: pointer; }
    #app { display: none; padding-bottom: 60px; }
    .header { display: flex; justify-content: space-between; padding: 15px; background: #121216; border-bottom: 1px solid #222; font-weight: bold; }
    .header span { color: #f39c12; }
    .wallet { color: #f39c12; }
    .games { display: grid; grid-template-columns: repeat(3, 1fr); gap: 10px; padding: 15px; }
    .card { background: #16161e; padding: 15px 5px; text-align: center; border-radius: 8px; border: 1px solid #222; font-size: 12px; font-weight: bold; }
    .nav { position: fixed; bottom: 0; width: 100%; background: #121216; display: flex; justify-content: space-around; padding: 10px 0; border-top: 1px solid #222; font-size: 11px; color: #888; }
  </style>
</head>
<body>

  <!-- LOGIN -->
  <div id="login-div" class="auth">
    <div class="box">
      <h2>FLAX eSPORTS</h2>
      <input type="text" id="l-id" placeholder="Mobile / Email">
      <input type="password" id="l-pass" placeholder="Password">
      <button onclick="login()">LOGIN</button>
      <div class="toggle" onclick="switchBox('signup')">Create Account? Sign Up</div>
    </div>
  </div>

  <!-- SIGNUP -->
  <div id="signup-div" class="auth" style="display:none;">
    <div class="box">
      <h2>SIGN UP</h2>
      <input type="text" id="s-name" placeholder="Full Name">
      <input type="text" id="s-phone" placeholder="Mobile Number">
      <input type="password" id="s-pass" placeholder="Password">
      <button onclick="signup()">REGISTER</button>
      <div class="toggle" onclick="switchBox('login')">Already have account? Login</div>
    </div>
  </div>

  <!-- MAIN APP -->
  <div id="app">
    <div class="header">
      <div>FLAX <span>eSPORTS</span></div>
      <div class="wallet">🪙 ₹0.00</div>
    </div>
    <div style="padding: 15px; font-weight: bold; font-size: 16px;">E-Sports Games</div>
    <div class="games">
      <div class="card">FF FULL MAP</div>
      <div class="card">LONE WOLF</div>
      <div class="card">CLASH SQUAD</div>
    </div>
    <div class="nav">
      <div>🏠 Home</div>
      <div>💳 Wallet</div>
      <div>📊 Leaderboard</div>
      <div onclick="logout()">👤 Logout</div>
    </div>
  </div>

  <script>
    function switchBox(type) {
      if(type === 'signup') {
        document.getElementById('login-div').style.display = 'none';
        document.getElementById('signup-div').style.display = 'flex';
      } else {
        document.getElementById('signup-div').style.display = 'none';
        document.getElementById('login-div').style.display = 'flex';
      }
    }
    function signup() {
      let p = document.getElementById('s-phone').value;
      let n = document.getElementById('s-name').value;
      let pass = document.getElementById('s-pass').value;
      if(p && n && pass) {
        localStorage.setItem(p, JSON.stringify({n, pass}));
        alert("Registered! Please Login.");
        switchBox('login');
      } else { alert("Fill all fields!"); }
    }
    function login() {
      let id = document.getElementById('l-id').value;
      let pass = document.getElementById('l-pass').value;
      let user = localStorage.getItem(id);
      if(user || (id && pass)) {
        localStorage.setItem('logged', id);
        showApp();
      } else { alert("Invalid details!"); }
    }
    function showApp() {
      document.getElementById('login-div').style.display = 'none';
      document.getElementById('signup-div').style.display = 'none';
      document.getElementById('app').style.display = 'block';
    }
    function logout() {
      localStorage.removeItem('logged');
      document.getElementById('app').style.display = 'none';
      switchBox('login');
    }
    window.onload = function() {
      if(localStorage.getItem('logged')) { showApp(); }
    }
  </script>
</body>
</html>
